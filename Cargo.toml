[package]
name = "dqwm-gpui"
version = "1.0.0"
edition = "2024"


# 禁止使用 unwrap、expect 等不安全操作
[lints.clippy]
unwrap_used = "deny"

#[lib]
#name = "dqwm"
#path = "src/lib.rs"
#crate-type = ["lib", "cdylib"]

#[[bin]]
#name = "道起微末"
#path = "src/main.rs"


[dependencies]
gpui-kit = "0.7.0"
rust-embed = { version = "8.7", features = ["include-exclude"] }

[build-dependencies]
winresource = "0.1"
image = "0.25"
ico = "0.4"

[profile.dev]
strip = false # 默认就是 false，再确认一次
debug = true  # 一定要有

[profile.release]
opt-level = "z"    # ③ 最高优化
lto = "thin"       # ① 链接秒级
codegen-units = 16 # ② 并行生成
strip = true       # 自动 strip 符号表（Rust 1.77+）